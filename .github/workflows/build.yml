name: Сборка

on:
  push:
    branches: [main, ryzikchat]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    name: Сервер (тесты)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Кэш шрифта эмодзи
        id: emoji-cache
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/emoji/ryzik_emoji.ttf
          key: emoji-font-${{ hashFiles('tools/emoji/**') }}
      - uses: actions/setup-python@v5
        if: steps.emoji-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
      - name: Шрифт эмодзи в стиле iOS (Fluent Emoji 3D)
        if: steps.emoji-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          sudo apt-get install -y -q pngquant
          pip install -q fonttools pillow flatbuffers
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/microsoft/fluentui-emoji /tmp/fluent
          git -C /tmp/fluent sparse-checkout set --no-cone '/assets/*/metadata.json' '/assets/*/3D/*.png' '/assets/*/*/3D/*.png'
          git -C /tmp/fluent checkout -q
          python3 tools/emoji/build_font.py /tmp/fluent/assets android/app/src/main/assets/emoji/ryzik_emoji.ttf
      - name: Тесты
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Сборка APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk RyzikChat.apk
      - name: Описание обновления (update.json)
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import json, os, re
          g = open('app/build.gradle.kts', encoding='utf-8').read()
          code = int(re.search(r'versionCode\s*=\s*(\d+)', g).group(1))
          name = re.search(r'versionName\s*=\s*"([^"]+)"', g).group(1)
          notes = (os.environ.get('NOTES') or '').strip()
          json.dump({
              'versionCode': code, 'versionName': name, 'notes': notes[:2000],
              'apk': 'https://github.com/cladecarvsna-creator/RyzikChat/releases/download/ryzikchat-latest/RyzikChat.apk',
          }, open('update.json', 'w', encoding='utf-8'), ensure_ascii=False)
          PY
          cat update.json
      - uses: actions/upload-artifact@v4
        with:
          name: RyzikChat-apk
          path: android/RyzikChat.apk
      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/RyzikChat.apk
      - name: Свежая сборка ветки ryzikchat
        if: github.ref == 'refs/heads/ryzikchat' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ryzikchat-latest
          name: RyzikChat (свежая сборка)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: "APK RyzikChat из ветки ryzikchat, коммит ${{ github.sha }}."
          files: |
            android/RyzikChat.apk
            android/update.json
